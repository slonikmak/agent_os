version: '3'
info:
  companyName: Personal Desk
  productName: Personal Desk
  productIdentifier: personal.personaldesk.desktop
  description: A private saved workspace
  version: 0.1.0
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: ['*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: npm --prefix frontend run dev
      type: background
      readiness:
        http: http://127.0.0.1:9245
        timeout: 30s
        interval: 200ms
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
