name: Desktop source and native build
on:
  push:
    paths: ['**']
  pull_request:
    paths: ['**']
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: wails3 generate bindings -f '-tags bindings' -ts -i
      - run: git diff --exit-code -- frontend/bindings
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Go formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Mac native binary
        if: runner.os == 'macOS'
        env:
          CGO_CFLAGS: '-mmacosx-version-min=15.0'
          CGO_LDFLAGS: '-mmacosx-version-min=15.0'
        run: go build -tags production -trimpath -o bin/personal-desk .
      - name: Windows native binary
        if: runner.os == 'Windows'
        run: go build -tags production -trimpath -ldflags='-H windowsgui' -o bin/personal-desk.exe .
      - name: Local Mac bundle check
        if: runner.os == 'macOS'
        run: sh scripts/package-mac.sh
# CI builds do not establish native Windows 11 UI/ACL acceptance or a release.
